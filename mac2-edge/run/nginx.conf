worker_processes 1;
pid "/Users/luffy/desktop/mac2-edge/run/nginx.pid";
error_log "/Users/luffy/desktop/mac2-edge/run/error.log";
events { worker_connections 128; }
http {
 access_log "/Users/luffy/desktop/mac2-edge/run/access.log";
 upstream pool {
  server 10.7.8.159:3001 max_fails=1 fail_timeout=5s;
  server 10.7.10.8:3002 max_fails=1 fail_timeout=5s;
 }
 server {
  listen 8443 ssl;
  server_name app.team1.test api.team1.test;
  ssl_certificate "/Users/luffy/desktop/mac2-edge/edge-2.crt";
  ssl_certificate_key "/Users/luffy/desktop/mac2-edge/run/edge.key";
  ssl_protocols TLSv1.2;
  add_header X-Edge Mac2 always;
  location / {
   proxy_pass http://pool;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_connect_timeout 2s;
   proxy_next_upstream error timeout;
   proxy_next_upstream_tries 2;
  }
 }
}
